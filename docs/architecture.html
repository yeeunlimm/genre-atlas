<footer><p>실선은 요청·내보내기, 점선은 결과 반환입니다. 로그인 왕복·개별 출처의 재시도·캐시는 간략화를 위해 생략했습니다.</p><p>CatBoost는 일반 곡 추천의 순위를 보조합니다. 댓글 분석은 찜 기반 플레이리스트 전용이며, 일반 추천 대기열을 재사용하지 않습니다. 찜과 플레이리스트는 계정별 브라우저 저장이고 기기 간 동기화가 아닙니다.</p><p>디자인: app/studio.css의 검정 #0c0c0d, 글자 #f0f0f0, 회색 #bdbdc4. 사이트의 시스템 글꼴을 사용하며 기기별 대체 글꼴이 적용될 수 있습니다.</p></footer>
